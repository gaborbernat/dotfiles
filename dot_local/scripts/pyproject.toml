[dependency-groups]
test = [
  "pygithub>=2.10.0",
  "pytest>=9.2",
  "pytest-mock>=3.17",
  "rich>=15.0.0",
  "rich-argparse>=1.8.0",
  "truststore>=0.10.4",
]
typing = [
  "packaging>=26.3",
  "pygobject-stubs>=2.13",
  "pygithub>=2.10.0",
  "rich>=15.0.0",
  "rich-argparse>=1.8.0",
  "truststore>=0.10.4",
  "ty>=0.0.86",
  "websockets>=15",
]

[tool.ruff]
target-version = "py314"
line-length = 120
format.preview = true
format.docstring-code-line-length = 120
format.docstring-code-format = true
lint.select = ["ALL"]
lint.ignore = [
  "COM812", # conflicts with formatter
  "CPY",    # personal scripts have no copyright headers
  "D1",     # application scripts have no public API docstrings
  "D203",   # incompatible with D211
  "D212",   # incompatible with D213
]
lint.per-file-ignores."src/*.py" = [
  "S603", # installed tools receive arguments without a shell
  "S606", # docker uses argv through execvp
  "S607", # installed tools resolve from PATH
]
lint.per-file-ignores."tests/*.py" = [
  "S101", # pytest uses assertions
]
lint.isort = { known-first-party = ["tests"] }

[tool.ty.environment]
python-version = "3.14"

[tool.pytest]
pythonpath = ["src"]
