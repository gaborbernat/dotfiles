[dependency-groups]
test = [
  "pygithub>=2.10.0",
  "pytest>=9.2",
  "pytest-mock>=3.17",
  "rich>=15.0.0",
  "rich-argparse>=1.8.0",
  "truststore>=0.10.4",
]
typing = [
  "packaging>=26.3",
  "pygobject-stubs>=2.13",
  "pygithub>=2.10.0",
  "rich>=15.0.0",
  "rich-argparse>=1.8.0",
  "truststore>=0.10.4",
  "ty>=0.0.86",
  "websockets>=15",
]

[tool.ruff]
target-version = "py314"
line-length = 120
format.preview = true
format.docstring-code-line-length = 120
format.docstring-code-format = true
lint.preview = true
lint.select = ["ALL"]
lint.ignore = [
  "missing-trailing-comma",            # conflicts with formatter
  "CPY",                               # personal scripts have no copyright headers
  "D1",                                # application scripts have no public API docstrings
  "incorrect-blank-line-before-class", # conflicts with blank-line-before-class
  "multi-line-summary-first-line",     # conflicts with multi-line-summary-second-line
]
lint.per-file-ignores."src/*.py" = [
  "subprocess-without-shell-equals-true", # installed tools receive arguments without a shell
  "start-process-with-no-shell",          # docker uses argv through execvp
  "start-process-with-partial-path",      # installed tools resolve from PATH
]
lint.per-file-ignores."tests/*.py" = [
  "assert", # pytest uses assertions
]
lint.isort = { known-first-party = ["tests"] }

[tool.ty.environment]
python-version = "3.14"

[tool.pytest]
pythonpath = ["src"]
