# Password comes from GMAIL_APP_PASSWORD in ~/.secrets (a Gmail app password, not the account password), read only
# for this command so shells never export it.
[Gmail]
source = imaps://gaborjbernat%40gmail.com@imap.gmail.com:993
source-cred-cmd = fish --no-config -c 'source ~/.secrets; printf %s $GMAIL_APP_PASSWORD'
outgoing = smtps://gaborjbernat%40gmail.com@smtp.gmail.com:465
outgoing-cred-cmd = fish --no-config -c 'source ~/.secrets; printf %s $GMAIL_APP_PASSWORD'
from = Bernát Gábor <gaborjbernat@gmail.com>
default = INBOX
# Gmail files sent mail itself, so a client-side copy would duplicate it.
copy-to =
archive = [Gmail]/All Mail
postpone = [Gmail]/Drafts
folder-map = ~/.config/aerc/folder-map
folders-sort = INBOX,Human,Automation
use-gmail-ext = true
cache-headers = true
check-mail = 2m
