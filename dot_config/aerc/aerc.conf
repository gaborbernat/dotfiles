[ui]
threading-enabled = true
fuzzy-complete = true
mouse-enabled = true
styleset-name = dracula
border-char-vertical = "│"
border-char-horizontal = "─"
sidebar-width = 22
dirlist-tree = true
index-columns = flags:2,name<20,subject,date>=
column-flags = {{if .IsUnread}}●{{else if .IsReplied}}↩{{else if .IsForwarded}}→{{else}} {{end}}{{if .IsFlagged}}◆{{else if .HasAttachment}}⊕{{else}} {{end}}
column-separator = "  "
timestamp-format = 2006-01-02
this-day-time-format = 15:04
this-week-time-format = Mon 15:04
this-year-time-format = Jan 02
message-view-timestamp-format = Mon, 02 Jan 2006 15:04

[viewer]
alternatives = text/plain,text/html

[filters]
text/plain = colorize
text/calendar = calendar
message/delivery-status = colorize
message/rfc822 = colorize
text/html = ! html
.headers = colorize
