# Behind the CalDigit TS4's USB 2.0 hubs the PodMic's 24-bit capture stalls within seconds with an I/O error;
# its 16-bit mode uses smaller USB packets and keeps streaming.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_input.usb-R__DE_R__DE_PodMic_USB_81441155-00.mono-fallback" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
      }
    }
  }
]
