---
name: 🛡️ scorecard
"on":
  branch_protection_rule:
  schedule:
    - cron: "30 7 * * 2"
  push:
    branches: ["main"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  analysis:
    name: 🛡️ Scorecard analysis
    if: github.repository == 'gaborbernat/dotfiles'
    permissions:
      actions: read
      checks: read
      contents: read
      id-token: write
      issues: read
      pull-requests: read
      security-events: write
      statuses: read
    uses: tox-dev/github-workflows/.github/workflows/scorecard.yaml@e0ddedd1f8d78ed93d5eb8290f37675f6092bddf
