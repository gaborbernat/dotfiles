---
name: 🧪 test
"on":
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  scripts:
    name: 🧪 Script tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: dot_local/scripts
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.3
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.15"
      - name: Run pytest
        run: uv run --locked --group test pytest
  hooks:
    name: 🧪 Claude hook tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.3
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.15"
      - name: Run pytest
        run: |
          uv run --no-project --with pytest==9.2.0 --with pytest-cov python -m pytest \
            private_dot_claude/hooks/tests -p no:cacheprovider \
            --cov=private_dot_claude/hooks --cov-branch --cov-fail-under=100
  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.3.3
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.15"
      - name: Install system linters
        run: |
          sudo add-apt-repository --yes ppa:fish-shell/release-4
          sudo apt-get install --yes fish
          uv tool install ruff==0.17.4
      # check-templates renders through chezmoi with this host's data, and systemd-analyze verify needs the units'
      # programs installed, so both run only locally.
      - name: Run prek
        run: uvx prek@0.5.10 run --all-files --show-diff-on-failure
        env:
          SKIP: check-templates,systemd-analyze-verify
