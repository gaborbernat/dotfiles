---
name: 🧪 test
"on":
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  scripts:
    name: 🧪 Script tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: dot_local/scripts
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.15"
      - name: Run pytest
        run: uv run --locked --group test pytest
  hooks:
    name: 🧪 Claude hook tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.15"
      # The exit-code test runs the rewritten command under bash and zsh, the shells Claude Code uses
      - name: Install zsh
        run: sudo apt-get install --yes zsh
      - name: Run pytest
        run: |
          uv run --no-project --with pytest==9.2.0 --with pytest-cov python -m pytest \
            private_dot_claude/hooks/tests -p no:cacheprovider \
            --cov=private_dot_claude/hooks --cov-branch --cov-fail-under=100
  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.15"
      - name: Install system linters
        run: |
          sudo add-apt-repository --yes ppa:fish-shell/release-4
          sudo apt-get install --yes fish libcairo2-dev libgirepository-2.0-dev pkg-config
          uv tool install ruff==0.17.4
          # Local runs read the ruff config this repo deploys to ~/.config/ruff
          install -D --mode=0644 dot_config/ruff/ruff.toml ~/.config/ruff/ruff.toml
      # check-templates renders through chezmoi with this host's data, and systemd-analyze verify needs the units'
      # programs installed, so both run only locally.
      - name: Run prek
        run: uvx prek@0.5.10 run --all-files --show-diff-on-failure
        env:
          SKIP: check-templates,systemd-analyze-verify
