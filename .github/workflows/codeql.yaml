---
name: 🛡️ CodeQL
"on":
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "20 9 * * 2"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  analyze:
    name: 🛡️ Analyze
    # github-workflows 6.8.3
    uses: tox-dev/github-workflows/.github/workflows/codeql.yaml@b34c57a8a06e7b043c2ddd0b6b7a8a778d7aa8f7
    permissions:
      contents: read
      security-events: write
    with:
      languages: '["actions","python","javascript-typescript"]'
