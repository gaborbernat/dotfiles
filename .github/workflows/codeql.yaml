---
name: 🛡️ CodeQL
"on":
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "20 9 * * 2"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  analyze:
    name: 🛡️ Analyze
    # github-workflows 6.8.3
    uses: tox-dev/github-workflows/.github/workflows/codeql.yaml@ef0cd88bef592260a48345753b8b509b209ab189
    permissions:
      contents: read
      security-events: write
    with:
      languages: '["actions","python","javascript-typescript"]'
