# Short names typed at home: the UniFi gateway resolves name.lan to the NAS, and SWAG sends the browser on to the same
# name under the duckdns wildcard, whose Let's Encrypt certificate every device already trusts; 302 rather than 301 so
# browsers do not cache the hop if a target moves
server {
    listen 80;
    listen [::]:80;
    server_name ~^(?<lan_name>[a-z0-9-]+)\.lan$;
    return 302 https://$lan_name.bernat-nas.duckdns.org$request_uri;
}

# Plex's own site answers 401 at /, its web app lives under /web/
server {
    listen 80;
    listen [::]:80;
    server_name plex.lan;
    location = / {
        return 302 https://plex.bernat-nas.duckdns.org/web/;
    }
    location / {
        return 302 https://plex.bernat-nas.duckdns.org$request_uri;
    }
}

# Devices without a login of their own stay off the internet-facing HTTPS listener: their short name goes straight to
# the device on the home network (port 80 is not forwarded from the internet)
server {
    listen 80;
    listen [::]:80;
    server_name presence.lan;
    return 302 http://10.2.0.112:42069$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name printer.lan;
    return 302 https://10.2.0.161$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name charger.lan;
    return 302 http://10.2.0.128$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name att.lan;
    return 302 http://192.168.1.254$request_uri;
}

server {
    server_name home.bernat-nas.duckdns.org;
    include /config/nginx/lan.conf;
    root /config/www/home;
    index index.html;
}

server {
    server_name photos.bernat-nas.duckdns.org;
    include /config/nginx/lan.conf;
    client_max_body_size 0;
    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        proxy_pass http://10.2.0.143:2283;
    }
}

# Home Assistant answers 400 to X-Forwarded-For from a proxy it has not been told to trust, so proxy.conf is left out
server {
    server_name ha.bernat-nas.duckdns.org;
    include /config/nginx/lan.conf;
    client_max_body_size 0;
    location / {
        include /config/nginx/resolver.conf;
        proxy_pass http://10.2.0.112:8123;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
}

server {
    server_name backyard-cam.bernat-nas.duckdns.org;
    include /config/nginx/lan.conf;
    client_max_body_size 0;
    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        proxy_pass https://10.2.10.21;
        proxy_ssl_verify off;
        proxy_redirect https://10.2.10.21 https://backyard-cam.bernat-nas.duckdns.org;
        proxy_redirect http://10.2.10.21 https://backyard-cam.bernat-nas.duckdns.org;
    }
}

server {
    server_name driveway-cam.bernat-nas.duckdns.org;
    include /config/nginx/lan.conf;
    client_max_body_size 0;
    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        proxy_pass https://10.2.10.22;
        proxy_ssl_verify off;
        proxy_redirect https://10.2.10.22 https://driveway-cam.bernat-nas.duckdns.org;
        proxy_redirect http://10.2.10.22 https://driveway-cam.bernat-nas.duckdns.org;
    }
}

# The printer refuses any Host, Origin or Referer but its own address
server {
    server_name unifi.bernat-nas.duckdns.org;
    include /config/nginx/lan.conf;
    client_max_body_size 0;
    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        proxy_pass https://10.2.0.1;
        proxy_ssl_verify off;
        proxy_redirect https://10.2.0.1 https://unifi.bernat-nas.duckdns.org;
        proxy_redirect http://10.2.0.1 https://unifi.bernat-nas.duckdns.org;
    }
}

server {
    server_name nas.bernat-nas.duckdns.org;
    include /config/nginx/lan.conf;
    client_max_body_size 0;
    location = / {
        return 302 /portal/;
    }
    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        proxy_pass https://10.2.0.213:52001;
        proxy_ssl_verify off;
        proxy_redirect https://10.2.0.213:52001 https://nas.bernat-nas.duckdns.org;
        proxy_redirect http://10.2.0.213:52001 https://nas.bernat-nas.duckdns.org;
    }
}

server {
    server_name portainer.bernat-nas.duckdns.org;
    include /config/nginx/lan.conf;
    client_max_body_size 0;
    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        proxy_pass http://10.2.0.213:19900;
    }
}

# Glances rejects any Host but the address it listens on, and a second Host header from proxy.conf
server {
    server_name monitor.bernat-nas.duckdns.org;
    include /config/nginx/lan.conf;
    client_max_body_size 0;
    location / {
        include /config/nginx/resolver.conf;
        proxy_pass http://10.2.0.213:61208;
        proxy_http_version 1.1;
        proxy_set_header Host 10.2.0.213:61208;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
}
