# The home-only sites on the duckdns wildcard: port 443 is forwarded from the internet, so only the Trusted network
# (and its hairpin traffic, which arrives from the gateway) may use them
listen 443 ssl;
listen [::]:443 ssl;
include /config/nginx/ssl.conf;
allow 10.2.0.0/24;
deny all;
# A separate log shows at a glance whether anything outside the house reached these sites
access_log /config/log/nginx/lan-access.log;
