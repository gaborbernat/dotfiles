# The home-only sites on the duckdns wildcard: port 443 is forwarded from the internet, so only the Trusted network may
# use them. Traffic that loops back through the public address arrives from the gateway and could come from the guest
# network, so the gateway's address is refused; home devices resolve these names to the NAS directly
listen 443 ssl;
listen [::]:443 ssl;
include /config/nginx/ssl.conf;
deny 10.2.0.1;
allow 10.2.0.0/24;
deny all;
# A separate log shows at a glance whether anything outside the house reached these sites
access_log /config/log/nginx/lan-access.log;
