---
keymap:
  - name: Chrome quit
    application:
      only: /google-chrome|chromium/
    remap:
      Super-Q: [Alt-F, X]
  - name: Browser reload
    application:
      only: /google-chrome|chromium|firefox/
    remap:
      Super-R: Ctrl-R
  - name: JetBrains quit
    application:
      only: /(?i:jetbrains|idea|pycharm|clion|webstorm|goland|rider)/
    remap:
      Super-Q: Alt-F4
  - name: Mac application shortcuts
    # Ghostty handles Super shortcuts itself, including terminal copy and paste.
    application:
      not: /ghostty/
    remap:
      Super-C: Ctrl-C
      Super-A: Ctrl-A
      Super-V: Ctrl-V
      Super-X: Ctrl-X
      Super-Z: Ctrl-Z
      Super-Q: Ctrl-Q
      Super-T: Ctrl-T
      Super-W: Ctrl-W
  - name: Firefox tabs
    application:
      only: /firefox/
    remap:
      Super-1: Alt-1
      Super-2: Alt-2
      Super-3: Alt-3
      Super-4: Alt-4
      Super-5: Alt-5
      Super-6: Alt-6
      Super-7: Alt-7
      Super-8: Alt-8
      Super-9: Alt-9
  - name: Other application tabs
    application:
      not: /ghostty|firefox/
    remap:
      Super-1: Ctrl-1
      Super-2: Ctrl-2
      Super-3: Ctrl-3
      Super-4: Ctrl-4
      Super-5: Ctrl-5
      Super-6: Ctrl-6
      Super-7: Ctrl-7
      Super-8: Ctrl-8
      Super-9: Ctrl-9
